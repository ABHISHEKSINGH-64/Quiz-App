<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Knowledge Quiz</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section id="welcome-screen" class="screen">
      <p class="eyebrow">Multiple choice</p>
      <h1>Knowledge Quiz</h1>
      <p class="lede">
        Answer one question at a time. A correct answer adds a point. A wrong
        answer or a missed minute takes one away. Your score never drops below zero.
      </p>
      <p class="total">
        <span id="question-total">0</span> questions
      </p>
      <button id="start-btn" type="button">Start Quiz</button>
    </section>

    <section id="quiz-screen" class="screen hidden">
      <header class="meta">
        <span id="progress-label">Question 1 of 1</span>
        <span id="score">Score 0</span>
        <span id="timer" class="timer">1:00</span>
      </header>
      <div class="progress-track" aria-hidden="true">
        <div id="progress-bar"></div>
      </div>
      <article class="card">
        <h2 id="question-text"></h2>
        <div id="options" class="options"></div>
        <p id="feedback" class="feedback" aria-live="polite"></p>
        <button id="next-btn" type="button" disabled>Next Question</button>
      </article>
    </section>

    <section id="results-screen" class="screen hidden">
      <p class="eyebrow">Quiz complete</p>
      <h1 id="final-score">Score 0</h1>
      <ul class="summary">
        <li><span>Correct</span><strong id="correct-count">0</strong></li>
        <li><span>Incorrect</span><strong id="incorrect-count">0</strong></li>
        <li><span>Unanswered</span><strong id="unanswered-count">0</strong></li>
      </ul>
      <h2 class="review-heading">Review</h2>
      <ol id="review-list" class="review"></ol>
      <button id="restart-btn" type="button">Restart Quiz</button>
    </section>
  </main>
  <script src="quiz.js"></script>
</body>
</html>
